# =============================================================================
# Railway configuration - Wajhatak backend service (backend/ as Root Directory)
#
# ALTERNATIVE to the repository-root railway.toml. Use this one only if you set
# the Railway service "Root Directory" to `backend`; otherwise the root
# railway.toml + root Dockerfile are used.
#
# The image ENTRYPOINT validates MySQL, migrates, seeds roles/permissions/
# locations + demo data + the admin account, then serves the app on $PORT with
# `php artisan serve` while running the queue worker in the background.
# Control panel is served at /admin.
# =============================================================================

# Use the project's Dockerfile (backend/ is the build context here).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# -----------------------------------------------------------------------------
# Deploy / runtime behavior for the app service
# -----------------------------------------------------------------------------
[deploy]
# The image ENTRYPOINT runs the bootstrap then starts the Laravel server.
startCommand = ""

# Health check so Railway knows the app is up. /up is Laravel's built-in
# health endpoint.
healthcheckPath = "/up"
healthcheckTimeout = 300

# Restart on failure so transient issues self-heal.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# -----------------------------------------------------------------------------
# IMPORTANT - Environment variables
# -----------------------------------------------------------------------------
# Railway's config-as-code (railway.toml) does NOT support variables. Add them
# in the dashboard instead: Project -> Variables (or the app service), e.g.:
#
#   LUX_ALLOW_DEMO_SEED = true     (demo/trial dataset; entrypoint defaults to true)
#   APP_KEY             = base64:...  (stable key across redeploys)
#   ADMIN_EMAIL / ADMIN_NAME / ADMIN_PASSWORD  (control-panel login)
#   APP_URL             = https://${{RAILWAY_PUBLIC_DOMAIN}}
#
# MySQL connection - attach a Railway MySQL service (name "MySQL"); its
# variables are exported into this service automatically. For example:
#   DB_CONNECTION = mysql
#   DB_URL        = ${{MySQL.MYSQL_URL}}     <- preferred, Laravel parses it
#   DB_HOST = ${{MySQL.MYSQLHOST}}  DB_PORT = ${{MySQL.MYSQLPORT}}
#   DB_DATABASE = ${{MySQL.MYSQLDATABASE}}  DB_USERNAME = ${{MySQL.MYSQLUSER}}
#   DB_PASSWORD = ${{MySQL.MYSQLPASSWORD}}
#
# The entrypoint is defensive: it also splits a mysql:// URL out of DB_HOST and
# will not start unless MySQL is reachable.
# =============================================================================