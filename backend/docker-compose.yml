# Wajhatak full stack: MySQL + Laravel + tiny real open-source LLM.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wajhatak}
      MYSQL_USER: ${DB_USERNAME:-wajhatak}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports: ["3306:3306"]
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","127.0.0.1","-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 10

  llm:
    build:
      context: ../deploy/llm
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
      LLAMA_ARG_HF_REPO: tensorblock/SmolLM2-135M-Instruct-GGUF:Q8_0
      LLAMA_ARG_HF_FILE: SmolLM2-135M-Instruct-Q8_0.gguf
      LLAMA_ARG_MODEL: ""
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080
      LLAMA_ARG_ALIAS: wajhatak-smollm2-135m-instruct-q8_0
      LLAMA_ARG_CTX_SIZE: 4096
      LLAMA_ARG_N_PREDICT: 256
      LLAMA_ARG_THREADS: ${LLM_THREADS:-2}
      LLAMA_ARG_PARALLEL: 1
    ports:
      - "127.0.0.1:11434:8080"
    volumes:
      - llm_models:/models
    mem_limit: ${LLM_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL","curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 45s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      llm: {condition: service_healthy}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_NAME: "وجهتك"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-wajhatak}
      DB_USERNAME: ${DB_USERNAME:-wajhatak}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: local
      RAILWAY_SERVICE_TYPE: app
      PORT: ${PORT:-8080}
      AI_ENABLED: "true"
      AI_ALLOW_RULE_FALLBACK: "true"
      AI_LLM_ENABLED: "true"
      AI_LLM_MODE: grounded
      AI_LLM_BASE_URL: http://llm:8080/v1
      AI_LLM_API_KEY: ""
      AI_LLM_MODEL: wajhatak-smollm2-135m-instruct-q8_0
      AI_LLM_MAX_OUTPUT_TOKENS: 256
      mem_limit: ${APP_MEM_LIMIT:-1g}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@wajhatak.app}
      ADMIN_NAME: ${ADMIN_NAME:-مدير النظام}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      LUX_ALLOW_DEMO_SEED: "true"
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - app_storage:/var/www/html/storage

volumes:
  db_data:
  app_storage:
  llm_models:
