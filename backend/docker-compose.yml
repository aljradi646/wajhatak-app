# =============================================================================
# Wajhatak local development / full-stack run
#
#   docker compose up --build
#
# This brings up a real MySQL 8 database, runs all Laravel migrations and
# seeds the control-panel admin account automatically, then serves the app at
# http://localhost:8080 with Caddy + PHP-FPM.
#
# Control panel:  http://localhost:8080/admin
#   login         admin@wajhatak.app  /  admin123   (override via .env)
#
# Note: On Railway the database is provisioned as its own managed service
# (MySQL or Postgres), and only the "app" service below is deployed - see the
# Dockerfile, entrypoint.sh and railway.toml for the platform configuration.
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # Database (local stand-in for Railway's managed MySQL service)
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wajhatak}
      MYSQL_USER: ${DB_USERNAME:-wajhatak}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Laravel application (PHP-FPM + Caddy)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_NAME: "وجهتك"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-wajhatak}
      DB_USERNAME: ${DB_USERNAME:-wajhatak}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: local
      RAILWAY_SERVICE_TYPE: app
      PORT: ${PORT:-8080}
      # ---------------------------------------------------------------------
      # خدمة الاستدلال المحلي للمساعد الذكي — تعمل داخل الحاوية نفسها
      # (نفس نمط عامل الطابور) عبر llama-server المبني في الصورة.
      # ---------------------------------------------------------------------
      AI_LOCAL_ENABLED: ${AI_LOCAL_ENABLED:-1}
      # سقف ذاكرة الحاوية: يستوعب النموذج (~2.6GB) + PHP + عامل الطابور.
      # ارفعه إن اخترت نموذجًا أكبر (7B → 8000+).
      mem_limit: ${APP_MEM_LIMIT:-6g}
      AI_LOCAL_MODEL_URL: ${AI_LOCAL_MODEL_URL:-https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf}
      AI_LOCAL_MODEL_NAME: ${AI_LOCAL_MODEL_NAME:-glm-4.6}
      AI_LOCAL_PORT: ${AI_LOCAL_PORT:-8018}
      AI_LOCAL_CONTEXT: ${AI_LOCAL_CONTEXT:-4096}
      AI_LOCAL_MAX_RAM_MB: ${AI_LOCAL_MAX_RAM_MB:-3500}
      AI_INFERENCE_BASE_URL: http://127.0.0.1:${AI_LOCAL_PORT:-8018}/v1
      AI_MODEL: ${AI_MODEL:-glm-4.6}
      # Control-panel admin account
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@wajhatak.app}
      ADMIN_NAME: ${ADMIN_NAME:-مدير النظام}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      # Demo/trial dataset (properties, agents, clients, chat, viewings)
      LUX_ALLOW_DEMO_SEED: "true"
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - app_storage:/var/www/html/storage
      # وحدة تخزين دائمة للنموذج (~1.9GB) — يُحمَّل مرة واحدة فقط.
      - ai_models:/var/www/html/storage/app/ai/models

volumes:
  db_data:
  app_storage:
  ai_models:
