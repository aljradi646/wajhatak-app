# =============================================================================
# خادم استدلال GLM المحلي — vLLM على GPU
# تشغيل مستقل عن خادم Laravel (نفس الشبكة الخاصة، لا تعرض للإنترنت).
#
#   docker compose up -d
#
# بعد التشغيل في Laravel (.env):
#   AI_INFERENCE_BASE_URL=http://ai-server:8000/v1
#   AI_MODEL=glm-4.6
#   AI_INFERENCE_API_KEY=مفتاح-اختياري-داخلي
# =============================================================================

services:
  vllm:
    image: vllm/vllm-openai:v0.8.5
    container_name: wajhatak-ai-inference
    restart: unless-stopped
    command: >
      --model zai-org/glm-4.6
      --served-model-name glm-4.6
      --max-model-len 16384
      --gpu-memory-utilization 0.90
      --disable-log-requests
    ports:
      # استبدل بـ "127.0.0.1:8000:8000" إن كان Laravel على نفس الجهاز،
      # أو استخدم شبكة Docker مشتركة بدل كشف المنفذ إطلاقًا.
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      # رقم GPU واحد يكفي لنموذج 7B-9B؛ GLM-4.6 يفضل 2×24GB أو A100.
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s   # تحميل الأوزان أول مرة يستغرق دقائق

volumes:
  hf-cache:
