name: Wajhatak CI

on:
  push:
    branches: ["main", "jules-*", "ai-agent-*", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wajhatak_test
          MYSQL_USER: wajhatak
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring,bcmath,intl,pdo_mysql,gd,zip
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
          dependency-versions: highest
      - run: cp .env.example .env && php artisan key:generate
      - name: Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wajhatak_test
          DB_USERNAME: wajhatak
          DB_PASSWORD: secret
          AI_LLM_ENABLED: "false"
          AI_ALLOW_RULE_FALLBACK: "true"
        run: php artisan test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting for changed Dart files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            files="$(git ls-files 'lib/**/*.dart' 'lib/*.dart')"
          else
            files="$(git diff --name-only --diff-filter=ACMR "$base_sha" "$GITHUB_SHA" -- 'lib/**/*.dart' 'lib/*.dart')"
          fi

          if [ -z "$files" ]; then
            echo "No changed Dart files require formatting validation."
            exit 0
          fi

          printf '%s\n' "$files" | xargs dart format --output=none --set-exit-if-changed

      - run: flutter analyze
      - run: flutter test
