name: lux_living
description: "LUX Living Arabic-first premium real-estate platform."
publish_to: 'none'
version: 0.3.0+4

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.0.0
  dio: ^5.8.0+1
  flutter_local_notifications: ^18.0.1
  flutter_map: ^8.1.1
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^10.0.0
  go_router: ^17.0.1
  image_picker: ^1.2.1
  intl: ^0.20.2
  latlong2: ^0.9.1
  share_plus: ^12.0.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fixtures/
